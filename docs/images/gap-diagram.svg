<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="'SF Mono', 'Fira Code', Consolas, monospace">
  <defs>
    <linearGradient id="gap-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="40%" stop-color="#1c2128"/>
      <stop offset="60%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="diag-lines" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M-1,1 l2,-2 M0,8 l8,-8 M7,9 l2,-2" stroke="#30363d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="900" height="320" fill="#0d1117" rx="12"/>

  <!-- gstack box -->
  <rect x="40" y="60" width="240" height="200" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="160" y="95" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">gstack</text>
  <text x="160" y="120" text-anchor="middle" fill="#8b949e" font-size="11">design + review</text>
  <line x1="70" y1="135" x2="250" y2="135" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="158" fill="#6e7681" font-size="11">/office-hours</text>
  <text x="80" y="178" fill="#6e7681" font-size="11">/plan-ceo-review</text>
  <text x="80" y="198" fill="#6e7681" font-size="11">/review</text>
  <text x="80" y="218" fill="#6e7681" font-size="11">/cso</text>
  <text x="80" y="238" fill="#3fb950" font-size="11">Design doc ✓</text>

  <!-- The gap -->
  <rect x="310" y="60" width="280" height="200" rx="8" fill="url(#gap-grad)" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="310" y="60" width="280" height="200" rx="8" fill="url(#diag-lines)" opacity="0.3"/>
  <text x="450" y="130" text-anchor="middle" fill="#f85149" font-size="14" font-weight="600">THE GAP</text>
  <text x="450" y="155" text-anchor="middle" fill="#8b949e" font-size="11">create beads → dispatch agents</text>
  <text x="450" y="173" text-anchor="middle" fill="#8b949e" font-size="11">poll completion → run reviews</text>
  <text x="450" y="191" text-anchor="middle" fill="#8b949e" font-size="11">interpret findings → trigger merge</text>
  <text x="450" y="220" text-anchor="middle" fill="#f85149" font-size="12" font-weight="600">You (manual glue)</text>
  <text x="450" y="240" text-anchor="middle" fill="#6e7681" font-size="10">context lost at every step</text>

  <!-- gastown box -->
  <rect x="620" y="60" width="240" height="200" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="740" y="95" text-anchor="middle" fill="#bc8cff" font-size="16" font-weight="700">gastown</text>
  <text x="740" y="120" text-anchor="middle" fill="#8b949e" font-size="11">agents + merge</text>
  <line x1="650" y1="135" x2="830" y2="135" stroke="#30363d" stroke-width="1"/>
  <text x="650" y="158" fill="#6e7681" font-size="11">gt convoy create</text>
  <text x="650" y="178" fill="#6e7681" font-size="11">gt sling → polecats</text>
  <text x="650" y="198" fill="#6e7681" font-size="11">gt convoy land</text>
  <text x="650" y="218" fill="#6e7681" font-size="11">refinery merge</text>
  <text x="650" y="238" fill="#3fb950" font-size="11">Merged code ✓</text>

  <!-- Arrows -->
  <line x1="280" y1="160" x2="310" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="160" x2="620" y2="160" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto"><path d="M0,0 L6,2 L0,4" fill="#8b949e"/></marker></defs>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Without the bridge, you are the integration layer</text>
  <text x="450" y="300" text-anchor="middle" fill="#d29922" font-size="12" font-weight="600">The bridge fills this gap — handles the toil, preserves your judgment</text>
</svg>
