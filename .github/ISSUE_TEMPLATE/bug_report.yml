name: Bug Report
description: Report a bug in gstack
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below so we can reproduce and fix it.

  - type: input
    id: skill
    attributes:
      label: Skill
      description: Which skill were you using? (e.g., /qa, /review, /browse)
      placeholder: /qa
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include the full error message if there is one.
      placeholder: Tell us what you saw
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Run `/qa https://example.com`
        2. ...
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Global (~/.claude/skills/gstack)
        - Repo-local (.claude/skills/gstack)
        - Codex (~/.codex/skills/gstack)
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: gstack version
      description: Run `cat ~/.claude/skills/gstack/package.json | grep version` or check CHANGELOG.md
      placeholder: "0.13.0.0"

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.4 / Ubuntu 24.04 / Windows 11

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else that helps.
